<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PayBuddy</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <rect width="24" height="24" rx="6" fill="#5F259F"/>
        <path d="M7 6H13.5C15.433 6 17 7.567 17 9.5C17 11.433 15.433 13 13.5 13H7V6Z" fill="white"/>
        <path d="M7 13H11V18H7V13Z" fill="white"/>
      </svg>
      PayBuddy
      <span class="brand-badge">INR Wallet</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="nav-user-name" class="text-sm font-semibold">Loading...</span>
      <a href="profile.html" class="transaction-avatar" style="width: 36px; height: 36px; text-decoration: none;">
        <span id="nav-user-initials">U</span>
      </a>
    </div>
  </header>

  <!-- Mobile-First Main Application Shell -->
  <main class="wallet-shell">
    <div class="px-4 py-4 flex-1">
      
      <!-- Wallet Balance Card -->
      <div class="wallet-balance-card mb-4">
        <div class="flex justify-between items-center">
          <span class="wallet-balance-label">Total Available Balance</span>
          <button id="btn-refresh-balance" title="Refresh Balance" style="color: white; opacity: 0.85;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
        <div class="wallet-balance-amount" id="wallet-balance-display">
          <span class="wallet-balance-currency">₹</span> ...
        </div>
        <div class="flex justify-between items-center text-xs" style="opacity: 0.9;">
          <span id="wallet-id-display">Wallet ID: Loading...</span>
          <span class="badge badge-success">ACTIVE</span>
        </div>
      </div>

      <!-- Quick UPI Action Buttons (PhonePe / Google Pay Style) -->
      <div class="quick-actions-grid">
        <a href="send-money.html" class="quick-action-btn">
          <div class="quick-action-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </div>
          <span class="quick-action-label">Send</span>
        </a>

        <a href="receive-money.html" class="quick-action-btn">
          <div class="quick-action-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </div>
          <span class="quick-action-label">Receive</span>
        </a>

        <a href="add-money.html" class="quick-action-btn">
          <div class="quick-action-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
          <span class="quick-action-label">Add Money</span>
        </a>
      </div>

      <!-- Recent Transactions Section -->
      <div class="card mt-4">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-semibold">Recent Transactions</h2>
          <a href="transactions.html" class="text-xs font-semibold text-brand">View All</a>
        </div>

        <div id="transactions-container">
          <div class="text-center py-4 text-muted text-sm">Loading transactions...</div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="flex justify-between items-center px-6 py-3" style="border-top: 1px solid var(--color-border); background: var(--color-surface);">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 text-brand font-semibold text-xs">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        Home
      </a>
      <a href="send-money.html" class="flex flex-col items-center gap-1 text-muted text-xs">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Send
      </a>
      <a href="transactions.html" class="flex flex-col items-center gap-1 text-muted text-xs">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        History
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-1 text-muted text-xs">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Profile
      </a>
    </nav>
  </main>

  <script type="module" src="../js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — PayBuddy</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .auth-container {
      max-width: 440px;
      margin: var(--space-8) auto;
      padding: var(--space-6);
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="../index.html" class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <rect width="24" height="24" rx="6" fill="#5F259F"/>
        <path d="M7 6H13.5C15.433 6 17 7.567 17 9.5C17 11.433 15.433 13 13.5 13H7V6Z" fill="white"/>
        <path d="M7 13H11V18H7V13Z" fill="white"/>
      </svg>
      PayBuddy
    </a>
    <a href="login.html" class="btn btn-ghost btn-sm">Log In</a>
  </header>

  <main class="app-container">
    <div class="auth-container">
      <h1 class="text-2xl font-bold mb-1">Open PayBuddy Wallet</h1>
      <p class="text-secondary text-sm mb-6">Create an account to automatically receive your primary INR digital wallet.</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Mobile Number</label>
          <input type="tel" id="phone" class="form-input" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="rahul@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 8 characters)</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="8">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block btn-lg mt-4">
          Create & Provision Wallet
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="../js/register.js"></script>
</body>
</html>

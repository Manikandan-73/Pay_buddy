<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — PayBuddy Wallet</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css?v=4.0">
  <link rel="stylesheet" href="../css/reset.css?v=4.0">
  <link rel="stylesheet" href="../css/animations.css?v=4.0">
  <link rel="stylesheet" href="../css/global.css?v=4.0">
  <link rel="stylesheet" href="../css/components.css?v=4.0">
  <style>
    .auth-container {
      max-width: 420px;
      margin: var(--space-8) auto;
      padding: var(--space-6);
      background: var(--color-surface);
      border-radius: var(--radius-2xl);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-md);
    }
    .demo-accounts {
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px dashed var(--color-border);
    }
  </style>
</head>
<body>

  <!-- Top App Navigation -->
  <header class="app-header">
    <div class="app-header-content">
      <a href="../index.html" class="brand-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="7" fill="url(#loginBrandGrad)"/>
          <path d="M7 6H13.5C15.433 6 17 7.567 17 9.5C17 11.433 15.433 13 13.5 13H7V6Z" fill="white"/>
          <path d="M7 13H11V18H7V13Z" fill="white"/>
          <defs>
            <linearGradient id="loginBrandGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#381466"/>
              <stop offset="0.6" stop-color="#5F259F"/>
              <stop offset="1" stop-color="#8050C7"/>
            </linearGradient>
          </defs>
        </svg>
        PayBuddy
      </a>
      <a href="register.html" class="btn btn-ghost btn-sm">Create Account</a>
    </div>
  </header>

  <main class="app-container page-enter">
    <div class="auth-container">
      <h1 class="text-2xl font-bold text-primary mb-1">Welcome back</h1>
      <p class="text-secondary text-sm mb-6">Enter your credentials to access your PayBuddy wallet.</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email or Mobile Number</label>
          <input type="text" id="email" class="form-input" placeholder="e.g. alice@paybuddy.local" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-password" id="btn-toggle-password" title="Toggle password visibility">
              <svg id="pwd-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block btn-lg mt-4 press-scale">
          Log In
        </button>
      </form>

      <!-- Quick Fill Demo Accounts -->
      <div class="demo-accounts">
        <span class="text-2xs font-bold text-muted uppercase">1-TAP DEMO PROFILES (Pre-funded with ₹10,000)</span>
        <div class="flex flex-col gap-2 mt-2">
          <button type="button" class="btn btn-ghost btn-sm text-brand" id="fill-alice" style="justify-content: flex-start;">
            👤 Alice Johnson (alice@paybuddy.local)
          </button>
          <button type="button" class="btn btn-ghost btn-sm text-brand" id="fill-bob" style="justify-content: flex-start;">
            👤 Bob Smith (bob@paybuddy.local)
          </button>
          <button type="button" class="btn btn-ghost btn-sm text-brand" id="fill-charlie" style="justify-content: flex-start;">
            👤 Charlie Brown (charlie@paybuddy.local)
          </button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
